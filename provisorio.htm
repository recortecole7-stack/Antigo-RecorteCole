             <script language="JavaScript1.2">
				//Drop-in slideshow II (hyperlinked)- By Dynamic Drive
				//For full source code and more DHTML scripts, visit http://www.dynamicdrive.com
				//This credit MUST stay intact for use
				var slideshow_width=468 //SET SLIDESHOW WIDTH (set to largest image's width if multiple dimensions exist)
				var slideshow_height=60 //SET SLIDESHOW HEIGHT (set to largest image's height if multiple dimensions exist)
				var pause=6700 //SET PAUSE BETWEEN SLIDE (2000=2 seconds)
				var dropimages=new Array()

				//SET IMAGE PATHS. Extend or contract array as needed
				dropimages[0]="./banners/cultura.gif"
				dropimages[1]="./banners/banner_mediz_lair.gif"
				dropimages[2]="./banners/webnow.gif"				

				var droplinks=new Array()

				//SET IMAGE URLs. Extend or contract array as needed
				droplinks[0]="http://www.livcultura.com.br/scripts/cultura/externo/index.asp?id_link=2909&tipo=17&n1=27&n2=1"
				droplinks[1]="http://www.orapois.com/mediz.php?page=2"
				droplinks[2]="http://www.webnow.com.br"

				////NO need to edit beyond here/////////////
				var preloadedimages=new Array()
				for (p=0;p<dropimages.length;p++){
				preloadedimages[p]=new Image()
				preloadedimages[p].src=dropimages[p]
				}
				var ie4=document.all&&navigator.userAgent.indexOf("Opera")==-1
				var dom=document.getElementById&&navigator.userAgent.indexOf("Opera")==-1
				if (ie4||dom)
					document.write('<div style="position:relative;width:'+slideshow_width+';height:'+slideshow_height+';overflow:hidden"><div id="canvas0" style="position:absolute;width:'+slideshow_width+';height:'+slideshow_height+';top:-'+slideshow_height+'"></div><div id="canvas1" style="position:absolute;width:'+slideshow_width+';height:'+slideshow_height+';top:-'+slideshow_height+'"></div></div>')
				else
					document.write('<a href="javascript:rotatelink()"><img name="defaultslide" src="'+dropimages[0]+'" border=0></a>')

				var curpos=slideshow_height*(-1)
				var degree=10
				var curcanvas="canvas0"
				var curimageindex=0
				var nextimageindex=1
			

				function movepic(){
				if (curpos<0){
				curpos=Math.min(curpos+degree,0)
				tempobj.style.top=curpos
				}
				else{
				clearInterval(dropslide)
				nextcanvas=(curcanvas=="canvas0")? "canvas0" : "canvas1"
				tempobj=ie4? eval("document.all."+nextcanvas) : document.getElementById(nextcanvas)
				tempobj.innerHTML='<a href="'+droplinks[curimageindex]+'"><img src="'+dropimages[curimageindex]+'" border=0></a>'
				nextimageindex=(nextimageindex<dropimages.length-1)? nextimageindex+1 : 0
				setTimeout("rotateimage()",pause)
				}
				}
				
				function rotateimage(){
				if (ie4||dom){
				resetit(curcanvas)
				var crossobj=tempobj=ie4? eval("document.all."+curcanvas) : document.getElementById(curcanvas)
				crossobj.style.zIndex++
				var temp='setInterval("movepic()",50)'
				dropslide=eval(temp)
				curcanvas=(curcanvas=="canvas0")? "canvas1" : "canvas0"
				}
				else
				document.images.defaultslide.src=dropimages[curimageindex]
				linkindex=curimageindex
				curimageindex=(curimageindex<dropimages.length-1)? curimageindex+1 : 0
				}
				
				function rotatelink(){
				window.location=droplinks[linkindex]
				}
				
				function resetit(what){
				curpos=slideshow_height*(-1)
				var crossobj=ie4? eval("document.all."+what) : document.getElementById(what)
				crossobj.style.top=curpos}
				
				function startit(){
				var crossobj=ie4? eval("document.all."+curcanvas) : document.getElementById(curcanvas)
				crossobj.innerHTML='<a href="'+droplinks[curimageindex]+'"><img src="'+dropimages[curimageindex]+'" border=0></a>'
				rotateimage()
				}
				
				if (ie4||dom)
				window.onload=startit
				else
				setInterval("rotateimage()",pause)
				
			</script>
